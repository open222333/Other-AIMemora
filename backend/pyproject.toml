[project]
name = "memora"
version = "0.1.0"
description = "MEMORA — One Memory. Every AI. Personal AI memory platform (self-hosted)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "pgvector>=0.3.6",
  "pyjwt>=2.10",
  "bcrypt>=4.2",
  "httpx>=0.28",
  "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI 的 Depends / File 預設值

[tool.pytest.ini_options]
testpaths = ["tests"]
